name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '25'

      - name: Download latest irij.jar
        run: |
          gh release download --repo aldebogdanov/irij --pattern 'irij.jar' --dir .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install seeds
        run: java -jar irij.jar install

      - name: Start server and verify
        run: |
          sudo mkdir -p /var/lib/irij.online/{seeds,seeds-db}
          sudo chown -R runner /var/lib/irij.online
          java --enable-native-access=ALL-UNNAMED -jar irij.jar --no-spec-lint server.irj &
          SERVER_PID=$!
          sleep 5
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080)
          BODY=$(curl -s http://localhost:8080)
          kill $SERVER_PID || true
          if [ "$RESPONSE" != "200" ]; then
            echo "Server returned HTTP $RESPONSE, expected 200"
            exit 1
          fi
          if ! echo "$BODY" | grep -qi "<html"; then
            echo "Response does not contain HTML"
            exit 1
          fi
          echo "Smoke test passed: HTTP 200 with HTML response"

      - name: Playground process evaluates code and needs no state
        run: |
          IRIJ_ONLINE_WORKDIR=/nonexistent PLAYGROUND_PORT=8081 \
            java --enable-native-access=ALL-UNNAMED -jar irij.jar --no-spec-lint server.irj playground &
          PG_PID=$!
          sleep 5
          OUT=$(curl -s -X POST http://localhost:8081/eval -d '{"code":"println 42"}')
          kill $PG_PID || true
          echo "$OUT"
          echo "$OUT" | grep -q '"stdout":"42' || { echo "playground process did not evaluate code" >&2; exit 1; }
